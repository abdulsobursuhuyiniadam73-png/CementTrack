<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Login | CementTrack</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <div class="login-icon" aria-hidden="true">C</div>
        <h1>CementTrack</h1>
        <p>Sign in to manage your cement business</p>
      </header>

      <form class="login-form" id="loginForm">
        <label for="email">Administrator email</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="Enter your email"
          required
        >

<label for="password">Password</label>
<div class="password-wrapper">
  <input
    type="password"
    id="password"
    autocomplete="current-password"
    placeholder="Enter your password"
    required
  >

  <button
    type="button"
    class="password-toggle"
    id="togglePassword"
    aria-label="Show password"
    aria-pressed="false"
  >
    <svg
      id="eyeIcon"
      xmlns="http://www.w3.org/2000/svg"
      width="21"
      height="21"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>
</div>

        <button class="login-submit" id="loginButton" type="submit">
          Sign In
        </button>

        <p id="loginMessage" class="login-message"
           role="status" aria-live="polite"></p>
      </form>

      <footer class="login-footer">
        Authorized administrator access only.
      </footer>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
